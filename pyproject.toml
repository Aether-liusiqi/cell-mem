[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cell-mem"
version = "0.1.0"
description = "Brain-inspired memory system for AI Agents — MCP Server for Claude Code & Codex CLI"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Siqi Liu", email = "Aether_Liusiqi@protonmail.com"},
]
keywords = [
    "memory",
    "ai-agent",
    "mcp-server",
    "brain-inspired",
    "llm",
    "claude-code",
    "codex-cli",
    "vector-search",
    "self-reflection",
    "generative-replay",
    "consolidation",
    "sqlite",
    "embedding",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.11"

[project.urls]
Homepage = "https://github.com/Aether-liusiqi/cell-mem"
Repository = "https://github.com/Aether-liusiqi/cell-mem.git"
Issues = "https://github.com/Aether-liusiqi/cell-mem/issues"
Changelog = "https://github.com/Aether-liusiqi/cell-mem/blob/main/CHANGELOG.md"
dependencies = [
    "mcp>=1.0.0",
    "sqlite-vec>=0.1.0",
    "sentence-transformers>=3.0.0",
    "numpy>=1.24.0",
    "pydantic>=2.0.0",
    "scikit-learn>=1.3.0",
    "chromadb>=1.5.0",
    "networkx>=3.0",
]

[project.optional-dependencies]
http = ["fastapi>=0.100.0", "uvicorn>=0.20.0"]
dev = ["pytest>=7.0.0", "pytest-cov>=4.0.0", "black>=24.0.0"]

[project.scripts]
cell-mem = "cell_mem.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.black]
line-length = 100
target-version = ['py311']
